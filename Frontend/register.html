<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unified ZA - Register</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class = "navbar">
            <div class="logo">
                <h2>UNIFIED ZA</h2>

            </div>
            <ul class="nav-links">
                <li>Home</li>
                <li>Universities</li>
                <li>My Applications</li>
                <li>Profile</li>
            </ul>
        </nav>
        <main class="main-content">
            <div class="login-card">
                <h1>Create Your Account</h1>

                <div class="role-selector">
                    <button class="role-btn active">Student</button>
                    <button class="role-btn">University Admin</button>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" />
                </div>

                <div class="form-group">
                    <label>ID Number</label>
                    <input type="text" />
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" />
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" />
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" />
                </div>

                <div class="form-group">
                    <label>Province</label>
                    <input type="text" />
                </div>

                <button class="login-btn">CREATE ACCOUNT</button>

                <p class="register-link">Already have an account? <a href="index.html">Log in</a></p>
            </div>
        </main>
        <footer class="footer">
            <p>UNIFIED ZA</p>
        </footer>
    
  </body>
</html>
